name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  # dawn supports macOS and Linux. Both are BUILT AND TESTED here rather than
  # cross-compiled, because the two things the platform split used to hide — the
  # run lock and process-group reaping — are runtime behaviour a compile cannot
  # check. Everything else fails to build by design (see platform.go), so there is
  # no matrix of targets to assert build tags against any more.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  unsupported-platforms-refuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: an unsupported platform must fail loudly, not build a degraded binary
        run: |
          set -eu
          fail=0
          for t in windows/amd64 freebsd/amd64 solaris/amd64 js/wasm; do
            if GOOS="${t%/*}" GOARCH="${t#*/}" go build ./... 2>/dev/null; then
              echo "FAIL $t: built, but dawn cannot honour its guarantees there"; fail=1
            else
              echo "ok   $t: refused"
            fi
          done
          exit $fail
