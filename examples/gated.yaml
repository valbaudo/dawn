# A gated step: one model drafts, an independent panel of three votes, and the
# step only commits if the panel agrees. On a rejection the critique is fed back
# and the draft regenerated, up to a fixed bound.
#
# `gate:` is data, not control flow — no branch, no loop variable. It is also what
# lets the language refuse if/loop/reduce entirely: a quorum needs counting,
# repair needs iteration, halting needs a conditional.
#
#   aw run examples/gated.yaml

steps:
  release_note:
    agent: claude/sonnet
    prompt: Write a three-sentence release note for a new `aw run --json` flag that streams machine-readable events.
    outputs:
      text: string
    gate:
      judges: [claude/haiku, claude/sonnet, claude/opus]
      quorum: 2 # omit for a majority; ties reject
      criteria: >
        You are a strict, independent reviewer. Approve ONLY if the release note
        is EXACTLY three sentences AND explicitly names the `aw run --json`
        feature. Be harsh.
