# Two steps wired by a TYPED reference. `draft.sentence` is checked when the plan
# loads, against draft's declared outputs — a typo fails before a token is spent.
#
#   dawn run examples/pipeline.yaml       # commits to .dawn/
#   dawn run examples/pipeline.yaml       # again: zero paid work
#   dawn show examples/pipeline.yaml      # what is stale, and the call count

steps:
  draft:
    agent: claude/sonnet
    prompt: Write one vivid sentence about content-addressed storage.
    outputs:
      sentence: string
      tone: [plain, vivid] # a sequence IS an enum

  tighten:
    agent: claude/opus
    prompt: Tighten the provided sentence. Return only the rewrite.
    inputs:
      draft: draft.sentence
    outputs:
      sentence: string
