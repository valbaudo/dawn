# The ENTIRE aw plan language, exercised once. Companion to SPEC.md.
#
# TARGETS THE SPEC, NOT TODAY'S RUNTIME — `output:` as a typed map, `expect:`,
# and `--in` are designed, not built. See "Delta" in SPEC.md. The other files in
# this directory run today.
#
#   aw run plan.yaml --in ./src              # run; re-running IS resume
#   aw run plan.yaml --in ./src --dry-run    # what is stale, and the worst-case bill
#   aw run plan.yaml --in ./src --redo build
#   aw show build --into ./out               # rewind is a read
#   jq -r '[.at,.step,(.rejected//"ok")]|@tsv' .aw/journal.jsonl

version: 1

agents:
  writer: { backend: claude, model: sonnet } # text
  coder: { backend: claude-ws, model: sonnet } # workspace: own scratch dir
  porter: { backend: codex, model: gpt-5.6 } # different vendor
  haiku: { backend: claude, model: haiku }
  opus: { backend: claude, model: opus }
  # model: is required. Omitting it lets the CLI resolve from ambient account
  # state — a variable the identity key cannot see.

steps:
  # --- 1. Fresh context. Always. There is no key for it, on any step. --------
  - id: triage
    agent: writer
    prompt: |
      Triage the open support queue. List the repository paths that need work,
      one per line, and rate today's urgency.
    output: # map form => JSON Schema; ALL fields required,
      summary: string #   additionalProperties:false — never author-written
      urgency: [low, medium, high] # a YAML sequence IS an enum
      paths: string
    gate: # DATA, not control flow. `inputs:` is not a gate key,
      judges: [haiku, opus] #   and no session exists anywhere in the language —
      criteria: > #   so judge independence is STRUCTURAL.
        Approve only if every line in `paths` looks like a real repository path
        and `summary` invents nothing not implied by them. Be harsh.
      # quorum omitted -> Majority(2) = 2. Writing `quorum: 2` hashes IDENTICALLY:
      # the key hashes the RESOLVED definition, so spelling a default is free.
      # attempts:/timeout: are not keys. 3 and 30m, hardcoded.

  # --- 2. Workspace. Host tree in, binary + picture out. --------------------
  - id: build
    agent: coder
    inputs:
      repo: steps.in.workspace # from `--in ./src`; a REF -> becomes the
        #   scratch dir. No host path in this file.
      paths: steps.triage.paths # a SCALAR -> appended as a labeled block.
        #   Bound, never substituted. No {{ }} anywhere.
    prompt: |
      Fix the files listed under "paths". Build the CLI to dist/aw and render
      coverage to docs/coverage.png. Then write a build log and the tool's sha256.
    expect: # a LIST, not a namespace: a postcondition.
      - dist/aw #   `git add -f --` forces these past .gitignore
      - docs/coverage.png #   (verified: `add -A` silently drops dist/)
        #   and errors if one was never produced.
    output: # THE PANEL JUDGES A RENDERING, NOT BYTES: git shows
      build_log: string #   a binary as one sentence. To gate CONTENT, declare
      tool_sha256: string #   a TEXT rendering and write criteria against it.
    gate:
      judges: [haiku, opus]
      criteria: >
        build_log must show a clean build with no skipped tests, tool_sha256 must
        be 64 hex characters, and the diff must not delete any test file.

  # --- 3. Artifacts move as the tree. Producer path == consumer path. -------
  - id: smoke
    agent: coder
    inputs:
      repo: steps.build.workspace # reserved: becomes THIS step's scratch dir.
        #   dist/aw and docs/coverage.png are exactly
        #   where `build` left them. Host FS untouched.
    prompt: |
      Run ./dist/aw --version, then confirm docs/coverage.png is a valid PNG.
    output:
      verdict: [pass, fail]
      notes: string

  # --- 4. Carrying context AND switching vendors: one mechanism, no keys. ---
  - id: handoff
    agent: writer
    inputs:
      summary: steps.triage.summary
      diff: steps.build.diff # reserved: --stat + a 128KB-capped patch,
      notes: steps.smoke.notes #   truncation declared IN the text.
    prompt: |
      Write a brief for an assistant that has not seen this work: decisions made,
      constraints, rejected alternatives, open questions, exact current state.
      No pleasantries, no recap of process.
    output:
      brief: string
    # There is no session to port, because there is no session in the language.
    # This brief is content-addressed, diffable, gate-able and replayable —
    # which a vendor transcript is not. Q2 and Q6 have the same answer.

  - id: port
    agent: porter # different vendor: nothing to refuse.
    inputs:
      brief: steps.handoff.brief
      verdict: steps.smoke.verdict # ORDERING + DATA. `needs:` is cut: it was
        #   excluded from the key, so on a second run
        #   it silently guaranteed nothing.
    prompt: |
      Continue the work described in the brief. Target a Go audience.
# What `triage`'s output compiles to (passed to `claude --json-schema`):
#
#   {"type":"object","additionalProperties":false,
#    "required":["summary","urgency","paths"],
#    "properties":{"summary":{"type":"string"},
#                  "urgency":{"enum":["low","medium","high"]},
#                  "paths":{"type":"string"}}}
#
# Push-down is an OPTIMIZATION, never the authority: the local validator
# re-checks every output on every backend, always.
#
# Runtime order, per step and per repair attempt:
#   invoke (fresh, 30m)
#     -> [workspace: git add -A; git add -f -- <expect>; write-tree; diff]
#     -> schema-validate locally
#     -> [gate: jury reads output JSON + evidence -> critique -> regenerate, <=3]
#     -> Blobs.Put(record) [fsync] -> append journal line [fsync]
#
#   a non-conforming output NEVER reaches a judge;
#   a missing declared path NEVER reaches a judge;
#   a non-conforming VERDICT is mechanical and propagates, never a `false` vote;
#   the committed record is the attempt the panel APPROVED (by index);
#   only an accepted result carries a `ref`, and only a `ref` serves a hit.
